services:
  agents-manager:
    build: .
    image: agents-manager-backend:0.1.0
    container_name: agents-manager
    restart: unless-stopped
    env_file: .env
    ports:
      - "8787:8787"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
